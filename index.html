  <script>
    // ⚠️ IMPORTANT: REPLACE THESE VALUES
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyCGM8lBnjEMy6-kHEbzg5BywiTSAcwKrcZNQgUgWykUfvXXO34ZE7yOg1IWBGHB537kg/exec';
    const WHATSAPP_NUMBER = '12462367556'; // Your restaurant's WhatsApp number
    
    let orderItems = [];
    
    // Category toggle
    document.querySelectorAll('.category-header').forEach(header => {
      header.addEventListener('click', function() {
        const targetId = this.getAttribute('data-target');
        const target = document.getElementById(targetId);
        const isShown = target.classList.contains('show');
        
        document.querySelectorAll('.menu-items').forEach(items => items.classList.remove('show'));
        document.querySelectorAll('.category-header').forEach(h => h.classList.remove('active'));
        
        if (!isShown) {
          target.classList.add('show');
          this.classList.add('active');
        }
      });
    });
    
    // Menu item selection
    document.querySelectorAll('.menu-item').forEach(item => {
      const checkbox = item.querySelector('.item-checkbox');
      
      checkbox.addEventListener('change', function() {
        if (this.checked) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
          item.querySelector('.qty-display').textContent = '1';
        }
        updateOrder();
      });
      
      item.addEventListener('click', function(e) {
        if (e.target.classList.contains('qty-btn') || e.target === checkbox) {
          return;
        }
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event('change'));
      });
    });
    
    // Quantity controls
    document.querySelectorAll('.qty-plus').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const display = this.previousElementSibling;
        let qty = parseInt(display.textContent);
        qty++;
        display.textContent = qty;
        updateOrder();
      });
    });
    
    document.querySelectorAll('.qty-minus').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const display = this.nextElementSibling;
        let qty = parseInt(display.textContent);
        if (qty > 1) {
          qty--;
          display.textContent = qty;
          updateOrder();
        }
      });
    });
    
    document.getElementById('orderType').addEventListener('change', updateOrder);
    
    function updateOrder() {
      orderItems = [];
      let subtotal = 0;
      
      document.querySelectorAll('.menu-item.selected').forEach(item => {
        const name = item.getAttribute('data-item');
        const price = parseFloat(item.getAttribute('data-price'));
        const qty = parseInt(item.querySelector('.qty-display').textContent);
        const itemSubtotal = price * qty;
        
        orderItems.push({
          name: name,
          price: price,
          quantity: qty,
          subtotal: itemSubtotal
        });
        
        subtotal += itemSubtotal;
      });
      
      const summaryDiv = document.getElementById('orderSummary');
      const summaryItems = document.getElementById('summaryItems');
      const summaryCalculations = document.getElementById('summaryCalculations');
      const submitBtn = document.getElementById('submitBtn');
      const orderType = document.getElementById('orderType').value;
      
      if (orderItems.length > 0) {
        summaryDiv.style.display = 'block';
        
        summaryItems.innerHTML = orderItems.map(item => `
          <div class="summary-item">
            <span>${item.name} × ${item.quantity}</span>
            <span>$${item.subtotal.toFixed(2)}</span>
          </div>
        `).join('');
        
        let total = subtotal;
        let calculationsHTML = `
          <div class="summary-subtotal">
            <span>Subtotal:</span>
            <span>$${subtotal.toFixed(2)}</span>
          </div>
        `;
        
        if (orderType === 'Delivery') {
          const serviceCharge = subtotal * 0.10;
          total = subtotal + serviceCharge;
          calculationsHTML += `
            <div class="summary-item">
              <span>Service Charge (10%):</span>
              <span>$${serviceCharge.toFixed(2)}</span>
            </div>
          `;
        }
        
        calculationsHTML += `
          <div class="summary-total">
            <span>TOTAL:</span>
            <span>$${total.toFixed(2)} BBD</span>
          </div>
        `;
        
        summaryCalculations.innerHTML = calculationsHTML;
        submitBtn.disabled = false;
      } else {
        summaryDiv.style.display = 'none';
        submitBtn.disabled = true;
      }
    }
    
    // Success Modal - Apps Script handles Botpress notification
    function showSuccessModal(orderNumber) {
      document.getElementById('modalOrderNumber').textContent = orderNumber;
      document.getElementById('successModal').classList.add('show');
      document.body.style.overflow = 'hidden';
      
      // Auto-redirect to WhatsApp after 5 seconds
      let countdown = 5;
      const countdownDisplay = document.getElementById('redirectCountdown');
      
      if (countdownDisplay) {
        countdownDisplay.textContent = countdown;
        
        const countdownInterval = setInterval(() => {
          countdown--;
          countdownDisplay.textContent = countdown;
          
          if (countdown <= 0) {
            clearInterval(countdownInterval);
            // Apps Script already sent to Botpress, just redirect
            window.location.href = `https://wa.me/${WHATSAPP_NUMBER}`;
          }
        }, 1000);
      }
    }
    
    // Form submission
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      if (orderItems.length === 0) {
        showMessage('Please select at least one item', 'error');
        return;
      }
      
      const customerName = document.getElementById('customerName').value.trim();
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const deliveryAddress = document.getElementById('deliveryAddress').value.trim();
      const orderType = document.getElementById('orderType').value;
      const specialInstructions = document.getElementById('specialInstructions').value.trim();
      
      if (!orderType) {
        showMessage('Please select order type', 'error');
        return;
      }
      
      let subtotal = orderItems.reduce((sum, item) => sum + item.subtotal, 0);
      let total = orderType === 'Delivery' ? subtotal * 1.10 : subtotal;
      
      const orderDetails = orderItems.map(item => 
        `${item.name} x${item.quantity} = $${item.subtotal.toFixed(2)}`
      ).join('\n');
      
      const totalAmount = '$' + total.toFixed(2) + ' BBD';
      
      // Show loading
      document.getElementById('loading').style.display = 'block';
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      
      // Build URL with parameters
      const params = new URLSearchParams({
        customerName: customerName,
        phoneNumber: phoneNumber,
        deliveryAddress: deliveryAddress,
        orderType: orderType,
        orderItems: orderDetails,
        totalAmount: totalAmount,
        specialInstructions: specialInstructions || 'None'
      });
      
      const url = SCRIPT_URL + '?' + params.toString();
      
      try {
        const response = await fetch(url, {
          method: 'GET',
          redirect: 'follow'
        });
        
        const result = await response.json();
        
        document.getElementById('loading').style.display = 'none';
        
        if (result.success) {
          // Show success modal - Apps Script already handled Botpress
          showSuccessModal(result.orderNumber);
          
          // Reset form
          document.getElementById('orderForm').reset();
          document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
          document.querySelectorAll('.menu-items').forEach(el => el.classList.remove('show'));
          document.querySelectorAll('.category-header').forEach(el => el.classList.remove('active'));
          orderItems = [];
          updateOrder();
          
          submitBtn.textContent = 'Submit Order';
          submitBtn.disabled = false;
        } else {
          showMessage('✗ ' + result.message, 'error');
          submitBtn.textContent = 'Submit Order';
          submitBtn.disabled = false;
        }
        
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').style.display = 'none';
        submitBtn.textContent = 'Submit Order';
        submitBtn.disabled = false;
        showMessage('✗ Error submitting order. Please try again.', 'error');
      }
    });
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      
      setTimeout(() => msg.style.display = 'none', 8000);
    }
  </script>
