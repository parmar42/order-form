<script>
    let orderItems = [];
    
    // IMPORTANT: Replace this with your actual Apps Script Web App URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzzQLlsJ-GNw9H3C5CW2HCHHoQXWdqIbULiMqBH8UfDTEJFMKUDhP9Rkifw2VvKFzynpg/exec';
    
    function toggleCategory(categoryId, headerElement) {
      const category = document.getElementById(categoryId);
      const isCurrentlyShown = category.classList.contains('show');
      
      document.querySelectorAll('.menu-items').forEach(items => {
        items.classList.remove('show');
      });
      document.querySelectorAll('.category-header').forEach(header => {
        header.classList.remove('active');
      });
      
      if (!isCurrentlyShown) {
        category.classList.add('show');
        headerElement.classList.add('active');
      }
    }
    
    document.querySelectorAll('.menu-item').forEach(item => {
      const checkbox = item.querySelector('.item-checkbox');
      
      checkbox.addEventListener('change', function(e) {
        e.stopPropagation();
        if (this.checked) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
          item.querySelector('.qty-display').textContent = '1';
        }
        updateOrder();
      });
      
      item.addEventListener('click', function(e) {
        if (e.target.classList.contains('qty-btn') || e.target === checkbox) {
          return;
        }
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event('change'));
      });
    });
    
    function increaseQty(event, btn) {
      event.stopPropagation();
      const qtyDisplay = btn.previousElementSibling;
      let qty = parseInt(qtyDisplay.textContent);
      qty++;
      qtyDisplay.textContent = qty;
      updateOrder();
    }
    
    function decreaseQty(event, btn) {
      event.stopPropagation();
      const qtyDisplay = btn.nextElementSibling;
      let qty = parseInt(qtyDisplay.textContent);
      if (qty > 1) {
        qty--;
        qtyDisplay.textContent = qty;
        updateOrder();
      }
    }
    
    function updateOrder() {
      orderItems = [];
      let subtotal = 0;
      
      document.querySelectorAll('.menu-item.selected').forEach(item => {
        const name = item.getAttribute('data-item');
        const price = parseFloat(item.getAttribute('data-price'));
        const qty = parseInt(item.querySelector('.qty-display').textContent);
        const itemSubtotal = price * qty;
        
        orderItems.push({
          name: name,
          price: price,
          quantity: qty,
          subtotal: itemSubtotal
        });
        
        subtotal += itemSubtotal;
      });
      
      const summaryDiv = document.getElementById('orderSummary');
      const summaryItems = document.getElementById('summaryItems');
      const summaryCalculations = document.getElementById('summaryCalculations');
      const submitBtn = document.getElementById('submitBtn');
      const orderType = document.getElementById('orderType').value;
      
      if (orderItems.length > 0) {
        summaryDiv.style.display = 'block';
        
        summaryItems.innerHTML = orderItems.map(item => `
          <div class="summary-item">
            <span>${item.name} × ${item.quantity}</span>
            <span>$${item.subtotal.toFixed(2)}</span>
          </div>
        `).join('');
        
        let calculationsHTML = `
          <div class="summary-subtotal">
            <span>Subtotal:</span>
            <span>$${subtotal.toFixed(2)}</span>
          </div>
        `;
        
        let total = subtotal;
        if (orderType === 'Delivery') {
          const serviceCharge = subtotal * 0.10;
          total = subtotal + serviceCharge;
          calculationsHTML += `
            <div class="summary-service-charge">
              <span>Service Charge (10%):</span>
              <span>$${serviceCharge.toFixed(2)}</span>
            </div>
          `;
        }
        
        calculationsHTML += `
          <div class="summary-total">
            <span>TOTAL:</span>
            <span>$${total.toFixed(2)} BBD</span>
          </div>
        `;
        
        summaryCalculations.innerHTML = calculationsHTML;
        submitBtn.disabled = false;
      } else {
        summaryDiv.style.display = 'none';
        submitBtn.disabled = true;
      }
    }
    
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      if (orderItems.length === 0) {
        showMessage('Please select at least one item from the menu', 'error');
        return;
      }
      
      const customerName = document.getElementById('customerName').value.trim();
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const deliveryAddress = document.getElementById('deliveryAddress').value.trim();
      const orderType = document.getElementById('orderType').value;
      const specialInstructions = document.getElementById('specialInstructions').value.trim();
      
      if (!orderType) {
        showMessage('Please select order type (Delivery or Takeout)', 'error');
        return;
      }
      
      let subtotal = orderItems.reduce((sum, item) => sum + item.subtotal, 0);
      let total = subtotal;
      
      if (orderType === 'Delivery') {
        total = subtotal * 1.10;
      }
      
      const orderDetails = orderItems.map(item => 
        `${item.name} x${item.quantity} = $${item.subtotal.toFixed(2)}`
      ).join('\n');
      
      const totalAmount = '$' + total.toFixed(2) + ' BBD';
      
      // Prepare data to send
      const formData = {
        customerName: customerName,
        phoneNumber: phoneNumber,
        deliveryAddress: deliveryAddress,
        orderType: orderType,
        orderItems: orderDetails,
        totalAmount: totalAmount,
        specialInstructions: specialInstructions
      };
      
      // Show loading
      document.getElementById('loading').style.display = 'block';
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').textContent = 'Submitting...';
      
      try {
        // Make POST request to Apps Script
        const response = await fetch(https://script.google.com/macros/s/AKfycbzzQLlsJ-GNw9H3C5CW2HCHHoQXWdqIbULiMqBH8UfDTEJFMKUDhP9Rkifw2VvKFzynpg/exec, {
          method: 'POST',
          mode: 'no-cors', // Important for cross-origin requests
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData)
        });
        
        // Note: With no-cors mode, we can't read the response
        // So we assume success if no error is thrown
        document.getElementById('loading').style.display = 'none';
        showMessage('✓ Order submitted successfully! We will contact you shortly.', 'success');
        
        // Reset form
        document.getElementById('orderForm').reset();
        document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
        document.querySelectorAll('.menu-items').forEach(el => el.classList.remove('show'));
        document.querySelectorAll('.category-header').forEach(el => el.classList.remove('active'));
        orderItems = [];
        updateOrder();
        
        document.getElementById('submitBtn').textContent = 'Submit Order';
        document.getElementById('submitBtn').disabled = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').textContent = 'Submit Order';
        showMessage('✗ Error submitting order. Please try again or call us directly.', 'error');
      }
    });
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      
      setTimeout(function() {
        msg.style.display = 'none';
      }, 8000);
    }
  </script>
