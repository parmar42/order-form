<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- MUST be above style for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Form</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      padding: 25px;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 15px;
      position: relative;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
      box-sizing: border-box;
    }

    .form-group i {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      pointer-events: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #45a049;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: 500;
      color: #333;
    }

    @media (max-width: 400px) {
      .container {
        padding: 15px;
      }
      h2 {
        font-size: 20px;
      }
      button {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Place Your Order</h2>

  <form id="orderForm">
    <div class="form-group">
      <input type="text" id="name" placeholder="Full Name" required>
      <i class="fas fa-user"></i>
    </div>

    <div class="form-group">
      <input type="text" id="contact" placeholder="Contact Info" required>
      <i class="fas fa-phone"></i>
    </div>

    <div class="form-group">
      <select id="item" required>
        <option value="">Select Product</option>
        <option value="Product A">Product A</option>
        <option value="Product B">Product B</option>
        <option value="Product C">Product C</option>
      </select>
      <i class="fas fa-box"></i>
    </div>

    <div class="form-group">
      <input type="number" id="qty" placeholder="Quantity" min="1" required>
      <i class="fas fa-sort-numeric-up"></i>
    </div>

    <div class="form-group">
      <textarea id="notes" placeholder="Additional Notes"></textarea>
      <i class="fas fa-sticky-note"></i>
    </div>

    <button type="submit">Submit Order</button>
  </form>

  <p id="status"></p>
</div>

<script>
  const webAppUrl = "YOUR_WEB_APP_URL"; // Replace with your Apps Script URL

  document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const data = {
      name: document.getElementById('name').value,
      contact: document.getElementById('contact').value,
      item: document.getElementById('item').value,
      qty: document.getElementById('qty').value,
      notes: document.getElementById('notes').value
    };

    fetch(webAppUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
      document.getElementById('status').innerText = 
        result.status === "success" ? "✅ Order submitted!" : "❌ Error: " + result.message;
      if (result.status === "success") {
        document.getElementById('orderForm').reset();
      }
    })
    .catch(error => {
      document.getElementById('status').innerText = "❌ Error: " + error;
    });
  });
</script>

</body>
</html>
